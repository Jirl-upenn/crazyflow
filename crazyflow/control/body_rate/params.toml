# Parameters for the CTBR body-rate controller.
#
# `J` is duplicated from crazyflow/drones/params.toml on purpose. It is the inertia the *controller*
# assumes, not the inertia the dynamics integrate, and keeping the two separate is what makes it
# possible to mismatch them deliberately (domain randomization, sim2real studies). Do not unify
# them, for the same reason crazyflow/control/mellinger/params.toml is not unified with the drone
# parameters.
#
# The gains are angular accelerations per unit rate error, so `J` restores physical torque units at
# the end of the controller. That is what lets one set of gains serve every drone below: the inertia
# cancels, and what is left is a demanded angular acceleration. Note that `kp = 250` is a *demand*
# of 250 rad/s per rad/s of error, not an achieved bandwidth -- the mixer saturates long before
# that, and the closed loop settles in 60-130 ms rather than the ~4 ms the gain alone would imply.
#
# There is no torque limit here: as in the Crazyflie firmware, saturation happens only in
# force_torque2rotor_vel's per-motor force clip. (A direction-preserving torque clamp with conditional
# anti-windup was removed on 4 Oct 2026: it has no firmware counterpart, gave no learning benefit in a
# 3-seed ablation, and policies trained with it lose half to nearly all of their performance under
# firmware-style saturation and vice versa.)
#
# The gains come from the CTBR loop in the agile_dev Isaac Lab environment, retuned where that
# platform's actuator model differs from crazyflow's. `kp` is unchanged at 250. `ki` is 200 rather
# than 500 and `kd` is 6.0 rather than 2.5, because crazyflow's fitted rotor dynamics are far slower
# than the 5 ms first-order motor lag that environment assumes (`rotor_dyn_coef` works out to a
# ~60 ms time constant on cf21B_500 and ~135 ms on cf2x_L250). More derivative damping and a less
# aggressive integrator are what that extra actuator phase lag buys. Measured roll/pitch step
# response to 1.745 rad/s from settled hover, at 500 Hz (re-measured 4 Oct 2026 without the torque clamp; with it:
# 2.3% / 0.060 s and 10.3% / 0.130 s; the unretuned column predates the change):
#
#   drone       overshoot  5% settling      with the unretuned ki=500, kd=2.5
#   cf21B_500        2.1%       0.058 s        28.5% / 0.078 s
#   cf2x_L250       10.2%       0.120 s        44.9% / 0.242 s
#
# Note that `kd` is only conditionally stable: it relies on the actuator lag to roll off the
# one-step backward difference it takes. Driving the rigid body from this controller with no
# actuator model at all diverges at any kd above ~1. That is not a case the simulation can reach --
# body_rate requires first principles dynamics, which always models the rotors -- but it does mean
# these gains are not a sensible starting point for a plant with much faster actuators.
#
# `int_err_max` is loose relative to what the platform can produce: reaching it requires many
# seconds of fully saturated rate error. It exists to bound windup during a sustained stall (a
# collision, a drone pinned against geometry), not to shape the nominal response.

[cf2x_L250]
[cf2x_L250.core]
J = [
    [16.8e-6, 0.0, 0.0],
    [0.0, 16.8e-6, 0.0],
    [0.0, 0.0, 29.8e-6]
]

[cf2x_L250.body_rate2force_torque]
kp = [250.0, 250.0, 120.0]
ki = [200.0, 200.0, 16.7]
kd = [6.0, 6.0, 0.0]
int_err_max = [33.3, 33.3, 166.7]

[cf2x_P250]
[cf2x_P250.core]
J = [  # From L250, as in drones/params.toml
    [16.8e-6, 0.0, 0.0],
    [0.0, 16.8e-6, 0.0],
    [0.0, 0.0, 29.8e-6]
]

[cf2x_P250.body_rate2force_torque]
kp = [250.0, 250.0, 120.0]
ki = [200.0, 200.0, 16.7]
kd = [6.0, 6.0, 0.0]
int_err_max = [33.3, 33.3, 166.7]

[cf2x_T350]
[cf2x_T350.core]
J = [
    [15.7e-6, 0.0, 0.0],
    [0.0, 17.1e-6, 0.0],
    [0.0, 0.0, 30.0e-6]
]

[cf2x_T350.body_rate2force_torque]
kp = [250.0, 250.0, 120.0]
ki = [200.0, 200.0, 16.7]
kd = [6.0, 6.0, 0.0]
int_err_max = [33.3, 33.3, 166.7]

[cf21B_500]
[cf21B_500.core]
J = [
    [25e-6, 0.0,   0.0],
    [0.0,   28e-6, 0.0],
    [0.0,   0.0,   49e-6]
]

[cf21B_500.body_rate2force_torque]
# The Crazyflie firmware's own rate loop (crazyflie-firmware platform_defaults_cf21bl.h, the brushless 2.1 this
# model represents), converted to these SI units (4 Oct 2026). Firmware gains are PWM per deg/s through the legacy
# mixer (r/2, p/2, +-yaw per motor, PWM linear in force at 0.2 N / 65535), so gain_cf = gain_fw * s / J with
#   s_rp = 2 L (0.2 / 65535) (180 / pi) = 1.2365e-5,  s_yaw = 4 * 0.00569 (0.2 / 65535) (180 / pi) = 3.98e-6
# (0.00569 = the firmware's THRUST2TORQUE); firmware kp 200/200/120, ki 400/400/16.7, kd 2.5/2.5/0. The integral
# limits are the firmware's 33.3 / 166.7 deg s in rad. `torque_clip` is the firmware's int16 saturation of each
# rate-PID output (attitude_pid_controller.c) seen through the same mixer -- a plain per-axis clip, no anti-windup;
# `zero_thrust_reset` resets the integral at zero thrust as controller_pid.c resets its PIDs. Roll and pitch gains
# differ only because J does: the firmware's are equal in torque. On this rotor model the loop overshoots a
# 1.745 rad/s roll step ~29% (5% settling 0.13 s) and yaw rises to 90% in 0.22 s; it trains at least as well as
# the previous crazyflow retune (kp 250/250/120, ki 200/200/16.7, kd 6/6/0, int_err_max 33.3/33.3/166.7 rad)
# in a 3-seed ablation (mjc_dronetests runs/oct04/fwloop vs faithful).
kp = [98.9, 88.3, 9.75]
ki = [197.8, 176.6, 1.356]
kd = [1.236, 1.104, 0.0]
int_err_max = [0.5812, 0.5812, 2.9095]
torque_clip = [7.07e-3, 7.07e-3, 2.28e-3]
zero_thrust_reset = true
